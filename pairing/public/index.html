<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO-XMD | PAIRING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Creepster&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 212, 255, 0.1);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }

        .strike-anim {
            animation: flash 0.2s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00d4ff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .logo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #00d4ff;
            box-shadow: 0 0 20px #00d4ff;
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #00d4ff; }
            50% { transform: scale(1.05); box-shadow: 0 0 40px #00d4ff; }
            100% { transform: scale(1); box-shadow: 0 0 20px #00d4ff; }
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 3.5em;
            margin: 10px 0;
            text-shadow: 0 0 15px #00d4ff;
            letter-spacing: 5px;
            color: #fff;
        }

        .scrolling-text {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            margin-bottom: 20px;
            border-top: 1px solid #00d4ff;
            border-bottom: 1px solid #00d4ff;
            overflow: hidden;
            white-space: nowrap;
        }

        .scrolling-text marquee {
            font-weight: bold;
            color: #00d4ff;
            text-shadow: 0 0 5px #00d4ff;
            font-size: 1.1em;
        }

        .stats {
            font-size: 1em;
            color: #00d4ff;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8em;
            color: #00d4ff;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #00d4ff;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            font-size: 1.1em;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #00d4ff, #0055ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #00d4ff;
        }

        button:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            border: 2px dashed #00d4ff;
            display: none;
        }

        .code-box {
            font-size: 2.5em;
            color: #fff;
            letter-spacing: 8px;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 0 0 15px #00d4ff;
            cursor: pointer;
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            position: relative;
        }

        .copy-btn {
            background: #0055ff;
            font-size: 0.9em;
            padding: 10px 20px;
            width: auto;
            display: inline-block;
        }

        .owner {
            margin-top: 25px;
            font-size: 0.9em;
            color: #888;
        }

        .owner span {
            color: #00d4ff;
            font-weight: bold;
            text-shadow: 0 0 5px #00d4ff;
        }

        .audio-control {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.8em;
            color: #00d4ff;
            z-index: 100;
            background: rgba(0, 212, 255, 0.1);
            padding: 10px;
            border-radius: 50%;
            border: 1px solid #00d4ff;
            transition: 0.3s;
        }

        .audio-control:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 10px #00d4ff;
        }

        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 5px solid #00d4ff;
            border-top: 5px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .server-online { display: inline-flex; align-items: center; gap: 9px; margin: 14px auto 20px; padding: 10px 18px; color: #00ff64; border: 1px solid #00ff64; border-radius: 999px; font-weight: bold; font-size: 0.82em; background: rgba(0, 40, 20, 0.55); box-shadow: 0 0 12px rgba(0, 255, 100, 0.3); }
        .server-online-dot { width: 9px; height: 9px; border-radius: 50%; background: #00ff64; box-shadow: 0 0 10px #00ff64; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00d4ff;
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 15px #00d4ff;
        }
    </style>
</head>
<body>
    <div class="lightning" id="lightning"></div>
    <div class="toast" id="toast">Copied!</div>
    
    <div class="container">
        <div class="audio-control" onclick="toggleMusic()">
            <i id="music-icon" class="fas fa-play"></i>
        </div>

        <div class="logo-container">
            <img src="/momo_xmd_blue_skull.jpg" class="logo" alt="MOMO-XMD Blue Skull Logo">
        </div>

        <h1>MOMO-XMD</h1>

        <div class="scrolling-text">
            <marquee>💀 PAIRING SESSION • MOMO XMD OWNER MOMO47 • PAIRING SESSION • MOMO XMD OWNER MOMO47 💀</marquee>
        </div>

        <div class="stats" id="user-stats">
            <i class="fas fa-users"></i> TOTAL SERVER USERS: <span id="user-count">LOADING...</span>
        </div>

        <div class="server-online">
            <span class="server-online-dot"></span> SERVER ONLINE
        </div>

        <div id="pairing-section">
            <div class="input-group">
                <label>WHATSAPP NUMBER</label>
                <input type="text" id="phone-number" placeholder="e.g. 255760298574">
            </div>
            <button onclick="getPairingCode()" id="submit-btn">GET PAIRING CODE</button>
        </div>

        <div class="loader" id="loader"></div>

        <div id="result">
            <div id="pairing-display">
                <div class="code-box" id="code-display" onclick="copyCode()">--------</div>
                <button class="copy-btn" onclick="copyCode()">COPY CODE</button>
                
                <div style="margin-top: 20px;">
                    <span id="status-text" style="font-size: 0.8em; color: #00d4ff;">WAITING FOR WHATSAPP...</span>
                </div>
            </div>
        </div>

        <div class="owner">
            DESIGNED BY <span>MOMO47</span> &copy; 2026
        </div>
    </div>

    <audio id="bgm" src="bgm.mp3" loop></audio>

    <script>
        let pollInterval;
        const bgm = document.getElementById('bgm');
        const lightning = document.getElementById('lightning');
        const toast = document.getElementById('toast');

        function toggleMusic() {
            const icon = document.getElementById('music-icon');
            if (bgm.paused) {
                bgm.play().catch(e => {});
                icon.className = 'fas fa-pause';
            } else {
                bgm.pause();
                icon.className = 'fas fa-play';
            }
        }

        // Start music on first click
        document.body.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play().catch(e => {});
                document.getElementById('music-icon').className = 'fas fa-pause';
            }
        }, { once: true });

        setInterval(() => {
            if (Math.random() > 0.9) {
                lightning.classList.add('strike-anim');
                setTimeout(() => lightning.classList.remove('strike-anim'), 300);
            }
        }, 4000);

        async function fetchStats() {
            try {
                const res = await fetch('/stats', { cache: 'no-store' });
                const data = await res.json();
                document.getElementById('user-count').innerText = data.totalPairings || '0';
            } catch (e) {
                document.getElementById('user-count').innerText = '0';
            }
        }
        fetchStats();
        setInterval(fetchStats, 10000);

        async function getPairingCode() {
            const num = document.getElementById('phone-number').value;
            if (!num) return alert('ENTER NUMBER!');

            const btn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const result = document.getElementById('result');

            btn.disabled = true;
            loader.style.display = 'block';
            result.style.display = 'none';

            try {
                const res = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: num })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    pollStatus(data.sessionKey);
                } else {
                    alert(data.error || 'Failed to get code');
                    btn.disabled = false;
                    loader.style.display = 'none';
                }
            } catch (e) {
                alert('Server Error');
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }

        function pollStatus(key) {
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/session-status/${key}`);
                    const data = await res.json();

                    if (data.code) {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('result').style.display = 'block';
                        document.getElementById('code-display').innerText = data.code;
                    }

                    if (data.status === 'connected') {
                        clearInterval(pollInterval);
                        document.getElementById('status-text').innerText = 'CONNECTED SUCCESSFULLY!';
                        document.getElementById('status-text').style.color = '#00ff64';
                    }
                } catch (e) {}
            }, 3000);
        }

        function copyCode() {
            const code = document.getElementById('code-display').innerText;
            if (code === '--------') return;
            
            navigator.clipboard.writeText(code).then(() => {
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }
    </script>
</body>
</html>
