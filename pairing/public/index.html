<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO-XMD PAIRING CODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle, #001100 0%, #000000 100%);
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            background: rgba(0, 10, 0, 0.9);
            border: 2px solid #0f0;
            box-shadow: 0 0 30px #0f0;
            border-radius: 5px;
            padding: 30px;
            position: relative;
        }
        .skull {
            font-size: 80px;
            text-shadow: 0 0 20px #f00, 0 0 40px #f00;
            margin-bottom: 20px;
            animation: flicker 2s infinite;
        }
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 0.99; text-shadow: 0 0 20px #f00; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; text-shadow: none; }
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 28px;
            margin: 15px 0;
        }
        .counter {
            border: 1px solid #0f0;
            padding: 8px;
            margin: 15px 0;
            background: #000;
            box-shadow: inset 0 0 10px #0f0;
            font-size: 18px;
        }
        input {
            width: 85%;
            background: #000;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 12px;
            font-size: 18px;
            box-shadow: 0 0 10px #0f0;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }
        button {
            width: 90%;
            background: #0f0;
            color: #000;
            border: none;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px #0f0;
            transition: 0.5s;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
        }
        button:hover {
            background: #000;
            color: #0f0;
            box-shadow: 0 0 25px #0f0;
        }
        .box {
            border: 1px solid #0f0;
            background: rgba(0, 20, 0, 0.8);
            border-radius: 5px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
            box-shadow: 0 0 15px #0f0;
        }
        .box h3 {
            margin-top: 0;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: #fff;
            text-shadow: 0 0 5px #0f0;
        }
        .code-display {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
            background: #000;
            padding: 15px;
            border: 2px dashed #f00;
            text-align: center;
            letter-spacing: 5px;
            margin: 15px 0;
            text-shadow: 0 0 10px #f00;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="skull">💀</div>
        <h1>MOMO-XMD PAIRING</h1>
        <div class="counter" id="users-counter">USERS: LOADING...</div>
        
        <div id="form-section">
            <input type="text" id="phone" placeholder="255765409584">
            <br>
            <button onclick="requestPair()">GET PAIRING CODE</button>
        </div>

        <div id="result-section" style="display:none;" class="box">
            <h3>PAIRING CODE 🔐</h3>
            <div class="code-display" id="code-box">---------</div>
            <button onclick="copyCode()" style="width:100%; margin-top:5px;">COPY CODE</button>
            <hr style="border-color: #0f0; margin: 20px 0;">
            <div style="font-size: 16px; line-height: 1.8;">
                <b style="color:#f00;">How to use 🤳</b><br>
                ◉ Open WhatsApp on your phone<br>
                ◉ Go to Linked Devices<br>
                ◉ Choose Link with phone number<br>
                ◉ Enter the code shown above
            </div>
        </div>

        <div class="footer">
            > ❑ Powered by MOMO-XMD ❑<br>
            > ❑ owner MOMO47 ❑
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                document.getElementById('users-counter').innerText = `USERS: ${data.totalPairings || 0}`;
            } catch (e) {
                document.getElementById('users-counter').innerText = `USERS: 0`;
            }
        }
        fetchStats();
        setInterval(fetchStats, 5000);

        async function requestPair() {
            const number = document.getElementById('phone').value.trim();
            if (!number) { alert('Please enter phone number!'); return; }
            
            const btn = document.querySelector('#form-section button');
            const originalText = btn.innerText;
            btn.innerText = 'CONNECTING...';
            btn.disabled = true;

            try {
                const res = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number })
                });
                const data = await res.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                    btn.innerText = originalText;
                    btn.disabled = false;
                    return;
                }

                const sessionKey = data.sessionKey;
                const interval = setInterval(async () => {
                    try {
                        const sRes = await fetch(`/session-status/${sessionKey}`);
                        const sData = await sRes.json();
                        if (sData.code) {
                            clearInterval(interval);
                            document.getElementById('form-section').style.display = 'none';
                            document.getElementById('result-section').style.display = 'block';
                            document.getElementById('code-box').innerText = sData.code;
                        } else if (sData.status === 'error') {
                            clearInterval(interval);
                            alert('Error: ' + (sData.message || 'Failed to get code.'));
                            btn.innerText = originalText;
                            btn.disabled = false;
                        }
                    } catch (e) {}
                }, 2000);

            } catch (e) {
                alert('Network error!');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function copyCode() {
            const code = document.getElementById('code-box').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('Pairing code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
