<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO-XMD PAIRING CODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #0a0a0a;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            border-radius: 12px;
            padding: 20px;
        }
        .skull {
            font-size: 60px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px #00ff66; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #fff;
            text-shadow: 0 0 10px #00ff66;
            font-size: 24px;
            margin: 10px 0;
        }
        .counter {
            background: #111;
            border: 1px dashed #00ff66;
            padding: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        input {
            width: 80%;
            padding: 10px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-size: 16px;
            text-align: center;
            border-radius: 5px;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            background: #00ff66;
            color: #000;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Share Tech Mono', monospace;
            transition: 0.3s;
        }
        button:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }
        .box {
            border: 1px solid #00ff66;
            background: #0f0f0f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }
        .box h3 {
            margin-top: 0;
            text-align: center;
            font-family: 'Cinzel', serif;
        }
        .code-display {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            background: #1a1a1a;
            padding: 10px;
            border: 1px dashed #00ff66;
            text-align: center;
            letter-spacing: 3px;
            margin: 10px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="skull">💀</div>
        <h1>MOMO-XMD PAIRING</h1>
        <div class="counter" id="users-counter">USERS: LOADING...</div>
        
        <div id="form-section">
            <input type="text" id="phone" placeholder="Enter number with country code e.g., 255765409584">
            <br>
            <button onclick="requestPair()">GET PAIRING CODE</button>
        </div>

        <div id="result-section" style="display:none;" class="box">
            <h3>MOMO-XMD PAIRING CODE 🔐</h3>
            <div class="code-display" id="code-box">---------</div>
            <button onclick="copyCode()" style="width:100%; margin-top:5px;">COPY CODE</button>
            <hr style="border-color: #00ff66; margin: 15px 0;">
            <div style="font-size: 14px; line-height: 1.6;">
                <b>How to use 🤳</b><br>
                ◉ Open WhatsApp on your phone<br>
                ◉ Go to Linked Devices<br>
                ◉ Choose Link with phone number<br>
                ◉ Enter the code shown above
            </div>
        </div>

        <div class="footer">
            > ❑ Powered by MOMO-XMD ❑<br>
            > ❑ owner MOMO47 ❑
        </div>
    </div>

    <!-- Background Audio -->
    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-scifi.mp3" type="audio/mp3">
    </audio>

    <script>
        // Start background music on first interaction
        document.addEventListener('click', () => {
            const audio = document.getElementById('bg-music');
            if (audio.paused) { audio.play().catch(e => {}); }
        }, { once: true });

        async function fetchStats() {
            try {
                const res = await fetch('/stats');
                const data = await res.json();
                document.getElementById('users-counter').innerText = `USERS: ${data.totalPairings || 0}`;
            } catch (e) {
                document.getElementById('users-counter').innerText = `USERS: 0`;
            }
        }
        fetchStats();
        setInterval(fetchStats, 5000);

        async function requestPair() {
            const number = document.getElementById('phone').value.trim();
            if (!number) { alert('Please enter phone number!'); return; }
            
            const btn = document.querySelector('#form-section button');
            btn.innerText = 'CONNECTING...';
            btn.disabled = true;

            try {
                const res = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number })
                });
                const data = await res.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                    btn.innerText = 'GET PAIRING CODE';
                    btn.disabled = false;
                    return;
                }

                // Poll status
                const sessionKey = data.sessionKey;
                const interval = setInterval(async () => {
                    try {
                        const sRes = await fetch(`/session-status/${sessionKey}`);
                        const sData = await sRes.json();
                        if (sData.code) {
                            clearInterval(interval);
                            document.getElementById('form-section').style.display = 'none';
                            document.getElementById('result-section').style.display = 'block';
                            document.getElementById('code-box').innerText = sData.code;
                        } else if (sData.status === 'error') {
                            clearInterval(interval);
                            alert('Failed to get code. Please try again.');
                            btn.innerText = 'GET PAIRING CODE';
                            btn.disabled = false;
                        }
                    } catch (e) {}
                }, 2000);

            } catch (e) {
                alert('Network error!');
                btn.innerText = 'GET PAIRING CODE';
                btn.disabled = false;
            }
        }

        function copyCode() {
            const code = document.getElementById('code-box').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('Pairing code copied to clipboard!');
            });
        }
    </script>
</body>
</html>
