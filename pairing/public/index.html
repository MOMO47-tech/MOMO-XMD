<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOMO-XMD | PAIRING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Creepster&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #00d4ff;
            font-family: 'Orbitron', sans-serif;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 212, 255, 0.1);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }

        .strike-anim {
            animation: flash 0.2s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(0, 20, 40, 0.85);
            border: 2px solid #00d4ff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .logo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid #00d4ff;
            box-shadow: 0 0 20px #00d4ff;
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px #00d4ff; }
            50% { transform: scale(1.05); box-shadow: 0 0 40px #00d4ff; }
            100% { transform: scale(1); box-shadow: 0 0 20px #00d4ff; }
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 3.5em;
            margin: 10px 0;
            text-shadow: 0 0 15px #00d4ff, 0 0 30px #ff0000;
            letter-spacing: 5px;
            color: #fff;
        }

        .scrolling-text {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            margin-bottom: 20px;
            border-top: 1px solid #00d4ff;
            border-bottom: 1px solid #00d4ff;
            overflow: hidden;
            white-space: nowrap;
        }

        .scrolling-text marquee {
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000;
            font-size: 1.1em;
        }

        .stats {
            font-size: 1em;
            color: #00ff64;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #00ff64;
            background: rgba(0, 255, 100, 0.1);
            padding: 10px;
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.8em;
            color: #00d4ff;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #00d4ff;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            font-size: 1.1em;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #00d4ff, #0055ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px #00d4ff;
        }

        button:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            border: 2px dashed #00d4ff;
            display: none;
        }

        .code-box {
            font-size: 2.5em;
            color: #fff;
            letter-spacing: 8px;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 0 0 15px #00ff64;
            cursor: pointer;
            background: rgba(0, 255, 100, 0.1);
            padding: 15px;
            border-radius: 10px;
        }

        .copy-btn {
            background: #ff0000;
            font-size: 0.9em;
            padding: 10px 20px;
            width: auto;
            display: inline-block;
        }

        .owner {
            margin-top: 25px;
            font-size: 0.9em;
            color: #888;
        }

        .owner span {
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 5px #ff0000;
        }

        .audio-control {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 1.8em;
            color: #00d4ff;
            z-index: 100;
        }

        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border: 5px solid #00d4ff;
            border-top: 5px solid #ff0000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-dot.active { background: #00ff64; box-shadow: 0 0 15px #00ff64; }
        .status-dot.error { background: #ff0000; box-shadow: 0 0 15px #ff0000; }

        .server-online { display: inline-flex; align-items: center; gap: 9px; margin: 14px auto 20px; padding: 10px 18px; color: #00ff64; border: 1px solid #00ff64; border-radius: 999px; font-weight: bold; font-size: 0.82em; background: rgba(0, 40, 20, 0.55); box-shadow: 0 0 12px rgba(0, 255, 100, 0.3); }
        .server-online-dot { width: 9px; height: 9px; border-radius: 50%; background: #00ff64; box-shadow: 0 0 10px #00ff64; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .tab.active { background: #00d4ff; color: #000; font-weight: bold; }

        #session-id-box {
            display: none;
            word-break: break-all;
            background: #111;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.7em;
            color: #00ff64;
            border: 1px solid #00ff64;
        }

        #retry-btn {
            display: none;
            background: #444;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="lightning" id="lightning"></div>
    
    <div class="container">
        <div class="audio-control" onclick="toggleMusic()">
            <i id="music-icon" class="fas fa-volume-up"></i>
        </div>

        <div class="logo-container">
            <img src="/momo_xmd_blue_skull.jpg" class="logo" alt="MOMO-XMD Blue Skull Logo">
        </div>

        <h1>MOMO-XMD</h1>

        <div class="scrolling-text">
            <marquee>💀 WELCOME FOR MOMO-XMD • THE ULTIMATE WHATSAPP BOT • POWERED BY RADI • OWNER MOMO47 • STAY ANONYMOUS 💀</marquee>
        </div>

        <div class="stats" id="user-stats">
            <i class="fas fa-users"></i> TOTAL SERVER USERS: <span id="user-count">LOADING...</span>
        </div>

            <div class="server-online" aria-label="Server status">
                <span class="server-online-dot"></span> SERVER ONLINE
            </div>

        <div class="tabs">
            <div class="tab active" id="tab-pairing" onclick="setMode('pairing')">PAIRING CODE</div>
            <div class="tab" id="tab-qr" onclick="setMode('qr')">QR CODE</div>
        </div>

        <div id="pairing-section">
            <div class="input-group">
                <label>WHATSAPP NUMBER</label>
                <input type="text" id="phone-number" placeholder="e.g. 255760298574">
            </div>
            <button onclick="getPairingCode()" id="submit-btn">INITIALIZE LINK</button>
        </div>

        <div id="qr-section" style="display: none;">
            <button onclick="getQR()" id="qr-btn">GENERATE QR</button>
        </div>

        <div class="loader" id="loader"></div>
        <p id="loader-text" style="font-size: 0.8em; color: #ff0000; display: none;"></p>

        <div id="result">
            <div id="pairing-display" style="display: none;">
                <div class="code-box" id="code-display" onclick="copyCode()">--------</div>
                <button class="copy-btn" onclick="copyCode()">COPY CODE</button>
                
                <div style="margin-top: 20px;">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text" style="font-size: 0.8em; color: #00d4ff;">WAITING FOR WHATSAPP...</span>
                </div>

                <div id="session-id-box"></div>
                <button id="retry-btn" onclick="location.reload()">RETRY CONNECTION</button>
            </div>

            <div id="qr-display" style="display: none;">
                <img id="qr-image" src="" alt="QR CODE" style="width: 200px; height: 200px; border: 4px solid #fff; border-radius: 10px;">
                <p style="color: #00ff64; font-weight: bold;">SCAN TO AUTHORIZE</p>
            </div>
        </div>

        <div class="owner">
            DESIGNED BY <span>MOMO47</span> &copy; 2026
        </div>
    </div>

    <audio id="bgm" src="bgm.mp3" loop></audio>

    <script>
        let pollInterval;
        let mode = 'pairing';
        const bgm = document.getElementById('bgm');
        const lightning = document.getElementById('lightning');

        function toggleMusic() {
            const icon = document.getElementById('music-icon');
            if (bgm.paused) {
                bgm.play().catch(e => {});
                icon.className = 'fas fa-volume-up';
            } else {
                bgm.pause();
                icon.className = 'fas fa-volume-mute';
            }
        }

        document.body.addEventListener('click', () => {
            if (bgm.paused) bgm.play().catch(e => {});
        }, { once: true });

        setInterval(() => {
            if (Math.random() > 0.9) {
                lightning.classList.add('strike-anim');
                setTimeout(() => lightning.classList.remove('strike-anim'), 300);
            }
        }, 4000);

        async function fetchStats() {
            try {
                const res = await fetch('/stats', { cache: 'no-store' });
                if (!res.ok) throw new Error('stats request failed');
                const data = await res.json();
                const total = Number.isFinite(Number(data.totalPairings)) ? Number(data.totalPairings) : 0;
                document.getElementById('user-count').innerText = total.toLocaleString();
            } catch (e) {
                document.getElementById('user-count').innerText = '0';
            }
        }
        fetchStats();
        setInterval(fetchStats, 10000);

        function setMode(m) {
            mode = m;
            document.getElementById('tab-pairing').classList.toggle('active', m === 'pairing');
            document.getElementById('tab-qr').classList.toggle('active', m === 'qr');
            document.getElementById('pairing-section').style.display = m === 'pairing' ? 'block' : 'none';
            document.getElementById('qr-section').style.display = m === 'qr' ? 'block' : 'none';
            document.getElementById('result').style.display = 'none';
            if (pollInterval) clearInterval(pollInterval);
        }

        async function getPairingCode() {
            const num = document.getElementById('phone-number').value;
            if (!num) return alert('ENTER NUMBER!');

            const btn = document.getElementById('submit-btn');
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loader-text');
            const result = document.getElementById('result');

            btn.disabled = true;
            loader.style.display = 'block';
            loaderText.style.display = 'block';
            loaderText.innerText = 'BYPASSING FIREWALLS...';
            result.style.display = 'none';

            const controller = new AbortController();
            const requestTimer = setTimeout(() => controller.abort(), 45000);
            try {
                const res = await fetch('/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number: num }),
                    cache: 'no-store',
                    signal: controller.signal
                });
                const raw = await res.text();
                let data;
                try { data = raw ? JSON.parse(raw) : {}; } catch { data = {}; }

                if (res.ok && data.success && data.sessionKey) {
                    document.getElementById('code-display').innerText = data.code || 'WAITING...';
                    document.getElementById('pairing-display').style.display = 'block';
                    document.getElementById('qr-display').style.display = 'none';
                    document.getElementById('status-text').innerText = data.code ? 'WAITING FOR WHATSAPP...' : 'REQUESTING PAIRING CODE...';
                    result.style.display = 'block';
                    startPolling(data.sessionKey);
                } else {
                    throw new Error(data.error || data.message || `SERVER RETURNED HTTP ${res.status}`);
                }
            } catch (e) {
                const message = e.name === 'AbortError'
                    ? 'SERVER TIMEOUT. Check the port or try the Heroku link.'
                    : (e.message || 'SERVER ERROR');
                alert(message);
            } finally {
                clearTimeout(requestTimer);
                btn.disabled = false;
                loader.style.display = 'none';
                loaderText.style.display = 'none';
            }
        }

        function startPolling(key) {
            if (pollInterval) clearInterval(pollInterval);
            let failCount = 0;
            pollInterval = setInterval(async () => {
                const controller = new AbortController();
                const requestTimer = setTimeout(() => controller.abort(), 10000);
                try {
                    const res = await fetch(`/session-status/${key}`, { cache: 'no-store', signal: controller.signal });
                    const data = await res.json();
                    const statusText = document.getElementById('status-text');
                    const statusDot = document.getElementById('status-dot');
                    const sessionBox = document.getElementById('session-id-box');
                    const retryBtn = document.getElementById('retry-btn');

                    if (data.code && document.getElementById('code-display').innerText !== data.code) {
                        document.getElementById('code-display').innerText = data.code;
                        statusText.innerText = 'ENTER THIS CODE IN WHATSAPP LINKED DEVICES';
                    }

                    if (data.status === 'connected') {
                        statusText.innerHTML = '<span style="color:#00ff64">SESSION SENT TO WHATSAPP INBOX!</span>';
                        statusDot.className = 'status-dot active';
                        if (data.sessionId) {
                            sessionBox.innerText = data.sessionId;
                            sessionBox.style.display = 'block';
                        }
                        clearInterval(pollInterval);
                        retryBtn.style.display = 'none';
                    } else if (data.status === 'error' || data.status === 'closed' || data.status === 'close' || data.status === 'timeout' || data.status === 'delivery_failed') {
                        statusText.textContent = data.message || 'CONNECTION FAILED. RETRY.';
                        statusText.style.color = '#ff0000';
                        statusDot.className = 'status-dot error';
                        clearInterval(pollInterval);
                        retryBtn.style.display = 'block';
                    } else {
                        statusText.innerText = 'STATUS: ' + String(data.status || 'CONNECTING').toUpperCase() + '...';
                        failCount = 0;
                    }
                } catch (e) {
                    failCount++;
                    if (failCount >= 3) {
                        statusText.innerText = e.name === 'AbortError' ? 'SERVER TIMEOUT — RETRY CONNECTION.' : 'SERVER UNAVAILABLE — RETRY CONNECTION.';
                        statusText.style.color = '#ff0000';
                        retryBtn.style.display = 'block';
                    }
                } finally {
                    clearTimeout(requestTimer);
                }
            }, 2000);
        }

        async function copyCode() {
            const code = document.getElementById('code-display').innerText.trim();
            if (!code || code === '--------' || code === 'WAITING...') {
                alert('PAIRING CODE IS NOT READY YET.');
                return;
            }

            let copied = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(code);
                    copied = true;
                }
            } catch (error) {}

            if (!copied) {
                const helper = document.createElement('textarea');
                helper.value = code;
                helper.setAttribute('readonly', '');
                helper.style.position = 'fixed';
                helper.style.left = '-9999px';
                helper.style.top = '0';
                document.body.appendChild(helper);
                helper.focus();
                helper.select();
                helper.setSelectionRange(0, helper.value.length);
                try { copied = document.execCommand('copy'); } catch (error) {}
                helper.remove();
            }

            alert(copied ? 'PAIRING CODE COPIED!' : 'COPY FAILED. LONG-PRESS THE CODE TO COPY.');
        }
    </script>
</body>
</html>
