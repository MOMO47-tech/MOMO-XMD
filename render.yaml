services:
  - type: web
    name: momo-xmd-pairing
    env: node
    buildCommand: npm install
    startCommand: node launcher.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MODE
        value: public
      - key: PREFIX
        value: "."
      - key: PAIRING_PROXIES
        sync: false
