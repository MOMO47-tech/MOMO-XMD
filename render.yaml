services:
  - type: web
    name: momo-xmd-pairing
    env: node
    buildCommand: npm ci --omit=dev
    startCommand: node launcher.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MODE
        value: public
      - key: PREFIX
        value: "."
      - key: PAIRING_PROXIES
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SESSION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: CHATBOT_MODEL
        value: gpt-4o-mini
